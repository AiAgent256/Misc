name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Game tests (headless server)
        run: |
          set +e
          timeout 900 gradle runGameTestServer --no-daemon > gametest.log 2>&1
          code=$?
          set -e
          grep -E "GAME TESTS COMPLETE|required tests (passed|failed)|failed!|Exception" gametest.log | tail -60
          if grep -q "All [0-9]* required tests passed" gametest.log; then echo "game tests passed"; else echo "game tests FAILED (exit $code)"; tail -150 gametest.log; exit 1; fi

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/logs
          cp build.log gametest.log /tmp/logs/ 2>/dev/null || true
          echo "$SHA ${{ job.status }} $(date -u +%FT%TZ)" > /tmp/logs/STATUS.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash -u -q || true
          git checkout -q --orphan ci-logs
          git rm -rf -q . || true
          cp /tmp/logs/* .
          git add -A
          git commit -q -m "logs $SHA"
          git push -q --force origin ci-logs
          git checkout -q -f ${{ github.sha }}

      - name: Publish jar to dist branch
        run: |
          set -e
          gradle jar --no-daemon -q
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/dist && cp "$JAR" /tmp/dist/
          cp "$JAR" /tmp/dist/stormhold-latest.jar
          echo "$SHA $(basename $JAR) $(date -u +%FT%TZ)" > /tmp/dist/BUILD.txt
          git checkout -q --orphan dist
          git rm -rf -q . || true
          cp /tmp/dist/* .
          git add -A
          git commit -q -m "build $SHA"
          git push -q --force origin dist
