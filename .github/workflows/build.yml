name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: stormhold-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar to dist branch
        run: |
          set -e
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/dist && cp "$JAR" /tmp/dist/
          cp "$JAR" /tmp/dist/stormhold-latest.jar
          echo "$SHA $(basename $JAR) $(date -u +%FT%TZ)" > /tmp/dist/BUILD.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan dist
          git rm -rf --quiet . || true
          cp /tmp/dist/* .
          git add -A
          git commit -m "build $SHA"
          git push --force origin dist
