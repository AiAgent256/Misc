name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Check resource JSON
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          bad = []
          for f in pathlib.Path("src/main/resources").rglob("*.json"):
              try:
                  json.loads(f.read_text(encoding="utf-8"))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print("\n".join(bad) or "all resource JSON parses")
          sys.exit(1 if bad else 0)
          PY

      - name: Build
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Game tests (headless server)
        run: |
          set +e
          timeout 900 gradle runGameTestServer --no-daemon > gametest.log 2>&1
          code=$?
          set -e
          grep -E "GAME TESTS COMPLETE|required tests (passed|failed)|failed!|Exception" gametest.log | tail -60
          if grep -q "All [0-9]* required tests passed" gametest.log; then echo "game tests passed"; else echo "game tests FAILED (exit $code)"; tail -150 gametest.log; exit 1; fi

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/logs
          cp build.log gametest.log /tmp/logs/ 2>/dev/null || true
          echo "$SHA ${{ job.status }} $(date -u +%FT%TZ)" > /tmp/logs/STATUS.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git stash -u -q || true
          # one folder of logs per build, the latest copied to the top; only those files are committed
          publish() {
            git fetch -q origin ci-logs && PREV=$(git rev-parse FETCH_HEAD) || PREV=""
            git checkout -q --orphan ci-logs 2>/dev/null || git checkout -q --orphan ci-logs-tmp
            git rm -rf -q --cached . || true
            if [ -n "$PREV" ]; then git ls-tree --name-only "$PREV" | grep -E '^[0-9a-f]{7,}$' | xargs -r git checkout -q "$PREV" -- ; fi
            mkdir -p "$SHA" && cp /tmp/logs/* "$SHA"/ && cp /tmp/logs/* .
            git add -- STATUS.txt "$SHA"
            git add -- build.log gametest.log 2>/dev/null || true
            git commit -q -m "logs $SHA"
            if [ -n "$PREV" ]; then git push -q --force-with-lease=ci-logs:"$PREV" origin HEAD:ci-logs; else git push -q --force origin HEAD:ci-logs; fi
          }
          for i in 1 2 3 4; do publish && break; sleep $((i * 5)); git checkout -q -f ${{ github.sha }}; git branch -D -q ci-logs ci-logs-tmp 2>/dev/null || true; done
          git checkout -q -f ${{ github.sha }}

      - name: Publish jar to dist branch
        run: |
          set -e
          gradle jar --no-daemon -q
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          SHA=$(git rev-parse --short HEAD)
          # GitHub refuses files over 100 MB and the jar carries every plan revision, so it goes up in parts:
          # cat stormhold-0.1.0.jar.part* > stormhold-0.1.0.jar puts it back together
          mkdir -p /tmp/dist && split -b 45000000 -d "$JAR" "/tmp/dist/$(basename $JAR).part"
          echo "$SHA $(basename $JAR) $(date -u +%FT%TZ) parts=$(ls /tmp/dist | grep -c part) sha1=$(sha1sum "$JAR" | cut -d' ' -f1)" > /tmp/dist/BUILD.txt
          git checkout -q --orphan dist
          git rm -rf -q --cached . || true
          cp /tmp/dist/* .
          # only the parts and the build note: the working tree's build/ and .gradle/ hold files GitHub refuses
          git add -f -- BUILD.txt "$(basename $JAR)".part*
          git commit -q -m "build $SHA"
          ok=0
          for i in 1 2 3 4 5 6; do git push --force origin dist && ok=1 && break; sleep $((i * 10)); done
          if [ "$ok" != 1 ]; then echo "jar not published to dist"; exit 1; fi
